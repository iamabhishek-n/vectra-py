name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      # PYSEC-2026-311 (chromadb) has no fix version available as of this writing.
      # Remove --ignore-vuln once chromadb ships a fix — check by running
      # `pip-audit` locally without the flag and seeing if it still appears.
      - run: pip-audit --ignore-vuln PYSEC-2026-311
